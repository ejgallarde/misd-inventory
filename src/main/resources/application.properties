spring.application.name=misd-inventory-dashboard

# MySQL Connection Details
spring.datasource.url=jdbc:mysql://localhost:3306/misd_inventory?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin

# Tell Spring we are using MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Keep this as 'none' since you already have the DDL to create tables manually
spring.jpa.hibernate.ddl-auto=none
# Force Hibernate to use the exact table names specified in the @Table annotation
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Remove for production. Use only while in DEV
spring.thymeleaf.cache=false

# MinIO Configuration (Local Object Storage)
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=misd-asset-registry

# ICT Equipment Categories for Catalog
inventory.categories=Desktop,Laptop,Tablet,Server,Printer,Mobile Phone,UPS,Monitor,Docking Station

# Document categories used when receiving a new asset
document.upload.categories=Delivery Receipt,Official Receipt / Invoice,Warranty Certificate,Inspection Report,Acceptance Report,Appendix 71,Serial Number Label,Photographs,Equipment Specification Sheet,Repair or Service Report,OR/CR,Insurance Policy,Deed of Sale,Title,Tax Declaration,Property Photo,Service Report

# Document Upload Validation
document.upload.max-size-mb=10
document.upload.allowed-extensions=pdf,jpg,jpeg,png,doc,docx,xls,xlsx

# Authentication / SSO
app.security.demo-mode=true
app.security.demo-user-email=admin@phlpost.gov.ph
app.security.demo-user-name=Administrator
app.security.oauth2.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration