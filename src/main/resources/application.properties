spring.application.name=misd-inventory-dashboard

# Load optional modular config files.
# application-local.properties holds credentials and machine-specific paths and
# is NOT tracked in git. Copy application-local.properties.example to create it,
# or supply the same names as environment variables. Placeholders below have no
# defaults on purpose: the application should fail to start with a clear message
# rather than quietly fall back to a shared development password.
spring.config.import=optional:classpath:application-dropdowns.properties,optional:classpath:application-local.properties

# MySQL Connection Details
spring.datasource.url=jdbc:mysql://localhost:3306/misd_inventory?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${MISD_DB_USERNAME}
spring.datasource.password=${MISD_DB_PASSWORD}

# Keep this as 'none' since you already have the DDL to create tables manually
spring.jpa.hibernate.ddl-auto=none
# Force Hibernate to use the exact table names specified in the @Table annotation
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Controllers put every reference map into the model before rendering, so no
# query needs an open session during view rendering. Closing it at the end of the
# request keeps a connection from being held for the whole render of a dashboard
# that draws four tables.
spring.jpa.open-in-view=false

# Remove for production. Use only while in DEV
spring.thymeleaf.cache=false

# MinIO Configuration (Local Object Storage)
minio.endpoint=http://localhost:9000
minio.access-key=${MISD_MINIO_ACCESS_KEY}
minio.secret-key=${MISD_MINIO_SECRET_KEY}
minio.bucket-name=misd-asset-registry

# Storage mode
# Supported values: filesystem, minio
storage.mode=filesystem
# Absolute path to the document store. Machine-specific: no default, because a
# wrong-but-plausible fallback silently writes uploads somewhere nobody backs up.
storage.filesystem.root-path=${MISD_STORAGE_ROOT}

# ICT Equipment Categories for Catalog
inventory.categories=Desktop,Laptop,Tablet,Server,Printer,Mobile Phone,UPS,Monitor,Docking Station,Firewall Equipment

# Document categories used when receiving and managing uploaded documents
document.upload.categories.it=Official Receipt / Invoice,Inspection Report,Acceptance Report,Serial Number Label,Photographs,Equipment Specification Sheet,Repair or Service Report,Service Report
document.upload.categories.vehicle=Delivery Receipt,Original Receipt (OR),Certificate of Registration (CR),PMS Report,Car Insurance Policy,Stencil,TPL,Driver's License,Warranty Certificate
document.upload.categories.property=Title,Tax Declaration,Property Photo,Deed of Sale,Appendix 71

# Document Upload Validation
document.upload.max-size-mb=10
document.upload.max-files=25
document.upload.allowed-extensions=pdf,jpg,jpeg,png,doc,docx,xls,xlsx

# Spring multipart limits must match/cover client-side upload constraints.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=60MB

# IT asset repair workflow
asset.workflow.supplier-owner-id=SUPPLIER
asset.workflow.maintenance-technician-job-title=Computer Maintenance Technologist

# Property accountability (PAR/ICS). Only these employment statuses may be the
# accountable owner of an asset, vehicle or property. Anyone else (e.g. Job
# Order, Contract of Service) can still be the assigned user or driver; the
# accountability then falls to the nearest eligible manager in their chain.
asset.accountability.eligible-employment-statuses=Regular

# Authentication / SSO
app.security.demo-mode=true
# Demo accounts, one per role (see config/AppRole), as email:ROLE pairs. All of
# them sign in with ${MISD_DEMO_USER_PASSWORD}. Demo mode only.
app.security.demo-users=admin@phlpost.gov.ph:ADMIN,clerk@phlpost.gov.ph:CLERK,finance@phlpost.gov.ph:FINANCE,viewer@phlpost.gov.ph:VIEWER
app.security.demo-user-password=${MISD_DEMO_USER_PASSWORD}
app.security.oauth2.enabled=false
# Entra ID (when enabled): app roles arrive in the ID token's "roles" claim and
# are mapped to registry roles here. Users with no mapped role are refused.
app.security.oauth2.roles-claim=roles
app.security.oauth2.role-mapping=MISD.Admin:ADMIN,MISD.Clerk:CLERK,MISD.Finance:FINANCE,MISD.Viewer:VIEWER
