<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Properties Registry - MISD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css"
        rel="stylesheet" />
    <link th:href="@{/css/app-theme.css}" rel="stylesheet" />
</head>

<body class="theme-app" data-theme="light">

    <!-- FLOATING TOAST NOTIFICATION -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
        <div th:if="${successMessage}" id="successToast" class="toast align-items-center text-bg-success border-0"
            role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold" th:text="${successMessage}"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a href="/" class="navbar-brand mb-0 h1 text-decoration-none"
                onclick="sessionStorage.setItem('dashboardActiveTab', 'properties');">&larr; Back to Dashboard</a>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm theme-toggle-btn fw-semibold" type="button" id="themeToggleBtn"
                    title="Switch theme" aria-label="Switch theme">☀️</button>
                <span class="navbar-text text-white">Master Real Estate & Facilities Registry</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
            <div>
                <h2 class="page-title fw-bold mb-1">Properties</h2>
                <p class="page-subtitle mb-0">Monitor custodianship, tax status, and facility details.</p>
            </div>
        </div>
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <table
                    th:replace="~{fragments/properties-table :: propertiesTable('propertiesTable', ${allProperties}, true)}">
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/components :: appFooter}"></div>

    <!-- CUSTODIAN MODAL -->
    <div class="modal fade" id="custodianModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-light">
                    <h5 class="modal-title">Designate Facility Custodian</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/properties/assign-custodian}" method="post">
                    <div class="modal-body">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Property</label>
                            <input type="text" class="form-control bg-light" id="custodianPropDisplay" readonly>
                            <input type="hidden" id="custodianPropID" name="propertyID">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Select Custodian / Postmaster</label>
                            <select class="form-select select2-dropdown" name="employeeID" required
                                style="width: 100%;">
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Assignment Notes</label>
                            <textarea class="form-control" name="conditionNotes" rows="2"
                                placeholder="e.g. Assigned as new Regional Director..." required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Assignment</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- TAX STATUS MODAL -->
    <div class="modal fade" id="taxModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-light">
                    <h5 class="modal-title text-success">Update Tax & Dues Status</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/properties/update-tax}" method="post">
                    <div class="modal-body">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <p>Updating financial compliance status for <strong id="taxPropDisplay"></strong>.</p>
                        <input type="hidden" id="taxPropID" name="propertyID">

                        <div class="mb-3">
                            <label class="form-label fw-bold">New Tax Status</label>
                            <select class="form-select" name="taxStatus" required>
                                <option th:each="taxStatus : ${propertyTaxStatusesUpdate}" th:value="${taxStatus}"
                                    th:text="${taxStatus}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Reference / Notes</label>
                            <textarea class="form-control" name="conditionNotes" rows="2"
                                placeholder="e.g. OR Number 123456 cleared..." required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-success">Update Status</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Property Detail Slideout (Offcanvas) -->
    <div th:replace="~{fragments/properties-detail :: propertyDetailOffcanvas}"></div>

    <!-- Property History Modal -->
    <div th:replace="~{fragments/properties-history :: propertyHistoryModal}"></div>

    <!-- Core Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script th:src="@{/js/ui-common.js}"></script>
    <script th:src="@{/js/csrf.js}"></script>
    <script th:src="@{/js/location-cascade.js}"></script>
    <script th:src="@{/js/properties-page.js}"></script>
</body>

</html>
