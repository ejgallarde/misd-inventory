<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong - MISD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app-theme.css}" rel="stylesheet" />
</head>

<body class="theme-app" data-theme="light">
    <div th:replace="~{fragments/components :: publicHeader}"></div>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="text-uppercase fw-bold text-muted small mb-2">
                            <span th:text="${status} ?: 'Error'">500</span>
                            <span th:if="${error}" th:text="' - ' + ${error}"></span>
                        </div>

                        <h1 class="h3 mb-3">That request could not be completed.</h1>

                        <p class="text-muted mb-4">
                            The registry did not save anything for this request. Go back and try again &mdash; if it
                            keeps happening, send this page's details to MISD so the cause can be traced in the
                            application log.
                        </p>

                        <dl class="row small mb-4">
                            <dt class="col-sm-3 text-muted">Requested path</dt>
                            <dd class="col-sm-9" th:text="${path} ?: 'Not recorded'">/</dd>
                            <dt class="col-sm-3 text-muted">Time</dt>
                            <dd class="col-sm-9" th:text="${timestamp} ?: 'Not recorded'"></dd>
                        </dl>

                        <div class="d-flex gap-2 flex-wrap">
                            <a th:href="@{/}" class="btn btn-primary">Back to dashboard</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/components :: appFooter}"></div>
    <script th:src="@{/js/ui-common.js}"></script>
</body>

</html>
