<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app-theme.css}" rel="stylesheet" />
</head>

<body class="theme-app" data-theme="light">
    <div class="container pt-3 d-flex justify-content-end">
        <button class="btn btn-sm theme-toggle-btn fw-semibold" type="button" id="themeToggleBtn"
            title="Switch theme">🌗 Theme</button>
    </div>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="mb-3">Sign in</h2>
                        <p class="text-muted">Use your work email to access the MISD inventory dashboard.</p>

                        <div th:if="${param.logout}" class="alert alert-info">You have been signed out.</div>
                        <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>

                        <form th:action="@{/login}" method="post" class="mt-3">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="mb-3">
                                <label for="username" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Sign in</button>
                        </form>

                        <hr class="my-4">
                        <div th:if="${entraConfigured}" class="d-grid">
                            <a class="btn btn-outline-secondary w-100" th:href="@{/oauth2/authorization/azure}">Sign in
                                with
                                Entra ID</a>
                        </div>
                        <div th:unless="${entraConfigured}" class="alert alert-warning mt-2 mb-0">
                            Entra ID SSO is not configured yet. Add your tenant settings in application.properties to
                            enable the single sign-on button.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/ui-common.js}"></script>
    <script th:src="@{/js/login-page.js}"></script>
</body>

</html>
