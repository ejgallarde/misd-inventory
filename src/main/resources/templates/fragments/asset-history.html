<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="assetHistoryModal" class="modal fade" id="assetHistoryModal" tabindex="-1"
        aria-labelledby="assetHistoryModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header asset-history-modal-header">
                    <div>
                        <h5 class="modal-title" id="assetHistoryModalLabel">Asset History</h5>
                        <div class="small text-white-50">Asset Tag: <span id="assetHistoryAssetTag"></span></div>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="assetHistoryError" class="alert alert-danger d-none" role="alert"></div>
                    <div class="table-responsive">
                        <table id="assetHistoryTable" class="table table-striped table-hover align-middle w-100">
                            <thead>
                                <tr>
                                    <th scope="col">Date and Time</th>
                                    <th scope="col">Log Type</th>
                                    <th scope="col">Action</th>
                                    <th scope="col">Recorded By / Employee</th>
                                    <th scope="col">Notes</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" id="printAssetHistoryBtn"
                        title="Print asset history">
                        <i class="bi bi-printer" aria-hidden="true"></i>
                        <span class="visually-hidden">Print asset history</span>
                    </button>
                    <button type="button" class="btn btn-outline-success" id="exportAssetHistoryBtn"
                        title="Export asset history to Excel">
                        <i class="bi bi-file-earmark-excel" aria-hidden="true"></i>
                        <span class="visually-hidden">Export asset history to Excel</span>
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" title="Close history">
                        <i class="bi bi-x-lg" aria-hidden="true"></i>
                        <span class="visually-hidden">Close</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
