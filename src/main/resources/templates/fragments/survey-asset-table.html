<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <table th:fragment="surveyAssetTable(tableId, surveyAssets, workflowActions)" th:id="${tableId}"
        class="table table-striped table-hover w-100 align-middle">
        <thead class="table-dark">
            <tr>
                <th>Survey Asset ID</th>
                <th>Property Number</th>
                <th>System Tag / Serial</th>
                <th>Custodian</th>
                <th>Type</th>
                <th>Last Calibration</th>
                <th>Calibration Due</th>
                <th>End User</th>
                <th>Status Overview</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="surveyAsset : ${surveyAssets}" class="survey-asset-table-row"
                th:data-survey-asset-id="${surveyAsset.surveyAssetID}"
                th:data-survey-asset-acquisition-year="${surveyAsset.acquisitionDate != null ? #temporals.year(surveyAsset.acquisitionDate) : ''}"
                th:data-survey-asset-manufacturer="${surveyCatalogMap[surveyAsset.catalogID] != null ? surveyCatalogMap[surveyAsset.catalogID].manufacturer : ''}"
                th:data-survey-asset-model="${surveyCatalogMap[surveyAsset.catalogID] != null ? surveyCatalogMap[surveyAsset.catalogID].modelName : ''}"
                th:data-survey-asset-type="${surveyCatalogMap[surveyAsset.catalogID] != null ? surveyCatalogMap[surveyAsset.catalogID].category : ''}"
                th:data-admin-status="${surveyAsset.adminLegalStatus}"
                th:data-operational-status="${surveyAsset.operationalStatus}"
                th:data-condition-status="${surveyAsset.conditionStatus}"
                th:data-calibration-due-date="${surveyAsset.calibrationDueDate}">
                <td>
                    <a href="#" class="text-decoration-none fw-bold survey-asset-detail-link"
                        th:data-survey-asset-id="${surveyAsset.surveyAssetID}"
                        th:text="${surveyAsset.surveyAssetID}"></a>
                </td>
                <td
                    th:text="${surveyAsset.propertyNumber != null and !#strings.isEmpty(surveyAsset.propertyNumber) ? surveyAsset.propertyNumber : 'N/A'}">
                </td>
                <td class="fw-bold">
                    <a href="#"
                        th:if="${(surveyAsset.assetTag != null and !#strings.isEmpty(surveyAsset.assetTag)) or (surveyAsset.serialNumber != null and !#strings.isEmpty(surveyAsset.serialNumber))}"
                        th:data-survey-asset-id="${surveyAsset.surveyAssetID}"
                        th:text="${!#strings.isEmpty(surveyAsset.assetTag) ? surveyAsset.assetTag : surveyAsset.serialNumber}"
                        class="text-decoration-none survey-asset-detail-link"></a>
                    <span
                        th:if="${#strings.isEmpty(surveyAsset.assetTag) and #strings.isEmpty(surveyAsset.serialNumber)}">N/A</span>
                </td>
                <td th:classappend="${surveyAsset.assignedCustodianID != null ? 'fw-bold' : ''}"
                    th:text="${surveyAsset.assignedCustodianID != null and employeeMap[surveyAsset.assignedCustodianID] != null ? employeeMap[surveyAsset.assignedCustodianID] : 'Unassigned'}">
                </td>
                <td
                    th:text="${surveyCatalogMap[surveyAsset.catalogID] != null ? surveyCatalogMap[surveyAsset.catalogID].category : 'Unknown'}">
                </td>
                <td
                    th:text="${surveyAsset.lastCalibrationDate != null ? #temporals.format(surveyAsset.lastCalibrationDate, 'MMM d, yyyy') : 'N/A'}">
                </td>
                <td th:classappend="${surveyAsset.calibrationDueDate != null and !surveyAsset.calibrationDueDate.isBefore(T(java.time.LocalDate).now()) and !surveyAsset.calibrationDueDate.isAfter(T(java.time.LocalDate).now().plusDays(30))} ? 'text-danger fw-bold' : ''"
                    th:title="${surveyAsset.calibrationDueDate != null and !surveyAsset.calibrationDueDate.isBefore(T(java.time.LocalDate).now()) and !surveyAsset.calibrationDueDate.isAfter(T(java.time.LocalDate).now().plusDays(30))} ? 'Calibration due within 30 days' : null"
                    th:text="${surveyAsset.calibrationDueDate != null ? #temporals.format(surveyAsset.calibrationDueDate, 'MMM d, yyyy') : 'N/A'}">
                </td>
                <td
                    th:text="${surveyAsset.endUserID != null and employeeMap[surveyAsset.endUserID] != null ? employeeMap[surveyAsset.endUserID] : 'N/A'}">
                </td>
                <td>
                    <div class="d-flex flex-column gap-1 small">
                        <span
                            th:if="${surveyAsset.adminLegalStatus != null and !#strings.isEmpty(surveyAsset.adminLegalStatus)}"
                            th:class="${@surveyAssetHelper.legalBadgeClass(surveyAsset.adminLegalStatus)}"
                            th:title="${@surveyAssetHelper.legalTooltip(surveyAsset.adminLegalStatus)}"
                            data-bs-toggle="tooltip" data-bs-placement="top"
                            th:text="${@surveyAssetHelper.legalLabel(surveyAsset.adminLegalStatus)}"></span>
                        <span
                            th:if="${surveyAsset.operationalStatus != null and !#strings.isEmpty(surveyAsset.operationalStatus)}"
                            th:class="${@surveyAssetHelper.operationalBadgeClass(surveyAsset.operationalStatus)}"
                            th:title="${@surveyAssetHelper.operationalTooltip(surveyAsset.operationalStatus)}"
                            data-bs-toggle="tooltip" data-bs-placement="top"
                            th:text="${@surveyAssetHelper.operationalLabel(surveyAsset.operationalStatus)}"></span>
                        <span
                            th:if="${surveyAsset.conditionStatus != null and !#strings.isEmpty(surveyAsset.conditionStatus)}"
                            th:class="${@surveyAssetHelper.conditionBadgeClass(surveyAsset.conditionStatus)}"
                            th:title="${@surveyAssetHelper.conditionTooltip(surveyAsset.conditionStatus)}"
                            data-bs-toggle="tooltip" data-bs-placement="top"
                            th:text="${@surveyAssetHelper.conditionLabel(surveyAsset.conditionStatus)}"></span>
                    </div>
                </td>
                <td class="survey-asset-actions-cell">
                    <div th:if="${workflowActions}" class="dropup">
                        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">Actions</button>
                        <ul class="dropdown-menu shadow-sm">
                            <li th:if="${@surveyAssetHelper.canAssignCustodian(surveyAsset.operationalStatus)}">
                                <a class="dropdown-item action-btn" href="#" data-bs-toggle="modal"
                                    data-bs-target="#surveyAssetAssignModal"
                                    th:data-id="${surveyAsset.surveyAssetID}"
                                    th:data-tag="${!#strings.isEmpty(surveyAsset.assetTag) ? surveyAsset.assetTag : surveyAsset.serialNumber}">Assign
                                    Custodian</a>
                            </li>
                            <li th:if="${@surveyAssetHelper.canReturnAsset(surveyAsset.operationalStatus)}">
                                <a class="dropdown-item action-btn" href="#" data-bs-toggle="modal"
                                    data-bs-target="#surveyAssetReturnModal"
                                    th:data-id="${surveyAsset.surveyAssetID}"
                                    th:data-tag="${!#strings.isEmpty(surveyAsset.assetTag) ? surveyAsset.assetTag : surveyAsset.serialNumber}">Return
                                    to Storage</a>
                            </li>
                            <li th:if="${@surveyAssetHelper.hasActions(surveyAsset.adminLegalStatus)}">
                                <hr class="dropdown-divider">
                            </li>
                            <li th:if="${@surveyAssetHelper.canMarkUnderCalibration(surveyAsset.conditionStatus)}">
                                <form
                                    th:action="@{/survey-assets/{surveyAssetID}/under-calibration(surveyAssetID=${surveyAsset.surveyAssetID})}"
                                    method="post" class="m-0">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="dropdown-item text-start">Mark Needs
                                        Calibration</button>
                                </form>
                            </li>
                            <li th:if="${@surveyAssetHelper.canMarkUnderRepair(surveyAsset.conditionStatus)}">
                                <form
                                    th:action="@{/survey-assets/{surveyAssetID}/under-repair(surveyAssetID=${surveyAsset.surveyAssetID})}"
                                    method="post" class="m-0">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="dropdown-item text-start">Mark as Under
                                        Repair</button>
                                </form>
                            </li>
                            <li th:if="${@surveyAssetHelper.canMarkBeyondEconomicRepair(surveyAsset.conditionStatus)}">
                                <form
                                    th:action="@{/survey-assets/{surveyAssetID}/ber(surveyAssetID=${surveyAsset.surveyAssetID})}"
                                    method="post" class="m-0">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="dropdown-item text-start">Mark as Beyond Economic
                                        Repair</button>
                                </form>
                            </li>
                            <li th:if="${@surveyAssetHelper.canMarkStolen(surveyAsset.adminLegalStatus)}">
                                <form
                                    th:action="@{/survey-assets/{surveyAssetID}/stolen(surveyAssetID=${surveyAsset.surveyAssetID})}"
                                    method="post" class="m-0">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="dropdown-item text-start">Mark as Stolen</button>
                                </form>
                            </li>
                            <li th:if="${@surveyAssetHelper.canMarkMissing(surveyAsset.adminLegalStatus)}">
                                <form
                                    th:action="@{/survey-assets/{surveyAssetID}/missing(surveyAssetID=${surveyAsset.surveyAssetID})}"
                                    method="post" class="m-0">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="dropdown-item text-start">Mark as Missing</button>
                                </form>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <a class="dropdown-item text-danger action-btn fw-bold" href="#"
                                    data-bs-toggle="modal" data-bs-target="#surveyAssetRetireModal"
                                    th:data-id="${surveyAsset.surveyAssetID}"
                                    th:data-tag="${!#strings.isEmpty(surveyAsset.assetTag) ? surveyAsset.assetTag : surveyAsset.serialNumber}">Dispose
                                    / Retire</a>
                            </li>
                            <li>
                                <a class="dropdown-item action-btn survey-asset-history-action" href="#"
                                    data-bs-toggle="modal" data-bs-target="#surveyAssetHistoryModal"
                                    th:data-survey-asset-id="${surveyAsset.surveyAssetID}"
                                    th:data-tag="${!#strings.isEmpty(surveyAsset.assetTag) ? surveyAsset.assetTag : surveyAsset.serialNumber}">View
                                    History</a>
                            </li>
                        </ul>
                    </div>
                    <button th:unless="${workflowActions}" type="button"
                        class="btn btn-sm btn-outline-secondary survey-asset-detail-link"
                        th:data-survey-asset-id="${surveyAsset.surveyAssetID}">View details</button>
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
