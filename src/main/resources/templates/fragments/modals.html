<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- Fleet Detail & Edit Modal -->
    <div class="modal fade" id="fleetModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Vehicle Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="fleetEditForm">
                        <input type="hidden" id="editVehicleId" name="vehicleId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>Plate Number</label>
                                <input type="text" class="form-control asset-field" id="editPlateNumber"
                                    name="plateNumber" disabled>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Vehicle Type</label>
                                <input type="text" class="form-control asset-field" id="editVehicleType"
                                    name="vehicleType" disabled>
                            </div>
                        </div>
                        <!-- Add other fields here -->
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="enableEditBtn">Enable Edit</button>
                    <button type="button" class="btn btn-primary d-none" id="saveEditBtn">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
