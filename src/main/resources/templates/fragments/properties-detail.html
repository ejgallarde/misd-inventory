<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="propertyDetailOffcanvas" class="offcanvas offcanvas-end shadow" tabindex="-1"
        id="propertyDetailOffcanvas" aria-labelledby="propertyDetailLabel" style="width: min(860px, 96vw);">
        <div class="offcanvas-header bg-dark text-white">
            <h5 class="offcanvas-title mb-0" id="propertyDetailLabel">Property Details</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                aria-label="Close"></button>
        </div>
        <div class="offcanvas-body bg-light">
            <form id="propertyEditForm">
                <input type="hidden" id="editPropertyID">
                <div class="row gy-2">
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Property Name</label>
                        <div id="propertyDetailName" class="form-control-plaintext"></div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Property Type</label>
                        <div id="propertyDetailType" class="form-control-plaintext"></div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Title Number</label>
                        <div id="propertyDetailTitle" class="form-control-plaintext"></div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Tax Declaration Number</label>
                        <div id="propertyDetailTaxDeclaration" class="form-control-plaintext"></div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Address Line 1</label>
                        <div id="propertyDetailAddressLine1" class="form-control-plaintext">
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Address Line 2</label>
                        <div id="propertyDetailAddressLine2" class="form-control-plaintext">
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Province</label>
                        <div id="propertyDetailProvince" class="form-control-plaintext">
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">City / Municipality</label>
                        <div id="propertyDetailCity" class="form-control-plaintext">
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Barangay</label>
                        <div id="propertyDetailBarangay" class="form-control-plaintext">
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Zip Code</label>
                        <div id="propertyDetailZipCode" class="form-control-plaintext property-detail-view-only">
                        </div>
                        <input type="text" id="editPropertyZipCode"
                            class="form-control property-field property-detail-edit-only d-none" maxlength="10">
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Acquisition Date</label>
                        <div id="propertyDetailAcquisitionDate" class="form-control-plaintext">
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Lot Area (sqm)</label>
                        <div id="propertyDetailLotArea" class="form-control-plaintext property-detail-view-only">
                        </div>
                        <input type="number" id="editPropertyLotArea"
                            class="form-control property-field property-detail-edit-only d-none" step="0.01">
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Floor Area (sqm)</label>
                        <div id="propertyDetailFloorArea" class="form-control-plaintext property-detail-view-only">
                        </div>
                        <input type="number" id="editPropertyFloorArea"
                            class="form-control property-field property-detail-edit-only d-none" step="0.01">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Property Details</label>
                        <div id="propertyDetailPropertyDetails"
                            class="form-control-plaintext property-detail-view-only"></div>
                        <textarea id="editPropertyDetails"
                            class="form-control property-field property-detail-edit-only d-none" rows="2"></textarea>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Assessed Value</label>
                        <div id="propertyDetailAssessedValue" class="form-control-plaintext property-detail-view-only">
                        </div>
                        <input type="number" id="editPropertyAssessedValue"
                            class="form-control property-field property-detail-edit-only d-none" step="0.01">
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Tax Status</label>
                        <div id="propertyDetailTaxStatus" class="form-control-plaintext property-detail-view-only">
                        </div>
                        <input type="text" id="editPropertyTaxStatus"
                            class="form-control property-field property-detail-edit-only d-none">
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Legal &amp; Titling Status</label>
                        <div id="propertyDetailLegalTitlingStatus"
                            class="form-control-plaintext property-detail-view-only">
                        </div>
                        <select id="editPropertyLegalTitlingStatus"
                            class="form-select property-field property-detail-edit-only d-none">
                            <option value="" selected disabled>Select legal/titling status</option>
                            <option th:each="status : ${propertyLegalTitlingStatuses}" th:value="${status}"
                                th:text="${status}"></option>
                        </select>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Operational &amp; Utilization Status</label>
                        <div id="propertyDetailOperationalStatus"
                            class="form-control-plaintext property-detail-view-only">
                        </div>
                        <select id="editPropertyOperationalStatus"
                            class="form-select property-field property-detail-edit-only d-none">
                            <option value="" selected disabled>Select operational status</option>
                            <option th:each="status : ${propertyOperationalStatuses}" th:value="${status}"
                                th:text="${status}"></option>
                        </select>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold d-flex align-items-center gap-1">
                            Condition Status
                            <span
                                title="Usable - No Known Issues: Fully usable with no known blocking condition.<br>Usable - Minor Repair Needed: Usable but needs minor corrective action.<br>Usable with Restrictions - Informal Settler Encroachment: Can be used with operational/legal limits due to encroachment.<br>Usable with Restrictions - Boundary or Right-of-Way Issue: Usable but constrained by access/boundary issues.<br>Not Usable - Informal Settler Occupation: Currently not usable due to occupation.<br>Not Usable - Major Structural Risk: Unsafe major risk or severe deterioration.<br>Not Usable - Under Legal Dispute: Use blocked by active legal dispute.<br>Not Usable - Environmental or Geohazard Risk: Use blocked by environmental/geohazard risk."
                                data-bs-toggle="tooltip" data-bs-html="true" data-bs-placement="top" class="text-muted"
                                style="cursor: help;">&#9432;</span>
                        </label>
                        <div id="propertyDetailConditionStatus"
                            class="form-control-plaintext property-detail-view-only">
                        </div>
                        <select id="editPropertyConditionStatus"
                            class="form-select property-field property-detail-edit-only d-none">
                            <option value="" selected disabled>Select condition status</option>
                            <option th:each="status : ${propertyConditionStatuses}" th:value="${status}"
                                th:text="${status}"></option>
                        </select>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Custodian</label>
                        <div id="propertyDetailCustodian" class="form-control-plaintext"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Remarks</label>
                        <div id="propertyDetailRemarks" class="form-control-plaintext">
                        </div>
                    </div>
                </div>

                <hr class="my-3">
                <h6 class="fw-bold mb-3">Attached Documents</h6>
                <div id="propertyDocumentsEmpty" class="text-muted small">No documents attached yet.</div>
                <table class="table table-sm table-bordered align-middle mb-0 documents-grid-table">
                    <thead class="table-light">
                        <tr>
                            <th>Category</th>
                            <th>File</th>
                            <th>Uploaded</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="propertyDocumentsTableBody"></tbody>
                </table>

                <div class="mt-3 property-detail-edit-only d-none">
                    <label class="form-label fw-bold text-muted small text-uppercase">Upload Additional
                        Documents</label>
                    <input type="file" id="propertyDetailDocumentFiles" class="form-control js-detail-document-input"
                        multiple data-document-preview-target="propertyDetailDocumentPreview"
                        data-document-category-template-target="propertyDetailDocumentCategoryTemplate"
                        th:attr="data-document-allowed-extensions=${documentUploadAllowedExtensions},data-document-max-size-mb=${documentUploadMaxSizeMb}"
                        accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx">
                    <select id="propertyDetailDocumentCategoryTemplate" class="d-none">
                        <option value="" selected disabled>Select a document category</option>
                        <option th:each="documentCategory : ${propertyDocumentUploadCategories}"
                            th:value="${documentCategory}" th:text="${documentCategory}"></option>
                    </select>
                    <ul id="propertyDetailDocumentPreview"
                        class="list-group list-group-flush border rounded mt-2 small"></ul>
                    <div class="d-grid d-md-flex justify-content-md-end mt-2">
                        <button type="button" id="uploadPropertyDocumentsBtn" class="btn btn-sm btn-primary">Upload
                            Selected</button>
                    </div>
                </div>
                <hr class="my-4">

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="button" class="btn btn-secondary w-100" data-bs-dismiss="offcanvas">Close</button>
                    <button type="button" id="enablePropertyEditBtn" class="btn btn-outline-secondary w-100">Enable
                        Edit Mode</button>
                    <button type="button" id="cancelPropertyEditBtn" class="btn btn-outline-danger w-100 d-none">Cancel
                        Edit</button>
                    <button type="button" id="savePropertyEditBtn" class="btn btn-primary w-100 d-none">Save
                        Changes</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
