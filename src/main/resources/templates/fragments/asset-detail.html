<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="assetDetailOffcanvas" class="offcanvas offcanvas-end shadow" tabindex="-1" id="itDetailOffcanvas"
        aria-labelledby="itDetailLabel" style="width: min(860px, 96vw);">
        <div class="offcanvas-header bg-dark text-white">
            <h5 class="offcanvas-title mb-0" id="itDetailLabel">IT Asset Details</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                aria-label="Close"></button>
        </div>
        <div class="offcanvas-body bg-light">
            <form id="itEditForm">
                <div class="row g-3 mb-3 asset-detail-view-only">
                    <div class="col-lg-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <div class="text-uppercase fw-bold text-muted small mb-2">Catalog Details</div>
                                <div id="assetCatalogSummary" class="small"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <div class="text-uppercase fw-bold text-muted small mb-2">Assigned To</div>
                                <div id="assetAssigneeSummary" class="small"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Asset Tag</label>
                        <input type="text" id="editAssetTag" name="assetTag" class="form-control it-field bg-white"
                            disabled>
                    </div>
                    <input type="hidden" id="editCatalogID" name="catalogID">
                    <div class="col-12">
                        <label class="form-label fw-bold text-muted small text-uppercase">Serial Number</label>
                        <input type="text" id="editSerialNumber" name="serialNumber"
                            class="form-control it-field bg-white" disabled>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Purchase Date</label>
                        <input type="date" id="editPurchaseDate" name="purchaseDate"
                            class="form-control it-field bg-white" disabled>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Purchase Price</label>
                        <div class="input-group">
                            <span class="input-group-text">PHP</span>
                            <input type="number" step="0.01" id="editPurchasePrice" name="purchasePrice"
                                class="form-control it-field bg-white" disabled>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Current Valuation
                            <span class="text-muted fw-normal text-lowercase ms-1" style="font-size: 0.75em;"
                                title="Straight-line depreciation based on purchase date and purchase price."
                                data-bs-toggle="tooltip" data-bs-placement="top">(straight-line)</span>
                        </label>
                        <div id="assetCurrentValuation" class="form-control-plaintext fw-bold text-primary"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Deployment &amp; Assignment
                            Status</label>
                        <select id="editDeploymentStatus" name="deploymentStatus" class="form-select it-field bg-white"
                            disabled>
                            <option th:each="status : ${assetDeploymentStatusOptions}" th:value="${status}"
                                th:text="${status}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Maintenance &amp; Health
                            Status</label>
                        <select id="editMaintenanceHealthStatus" name="maintenanceHealthStatus"
                            class="form-select it-field bg-white" disabled>
                            <option th:each="status : ${assetMaintenanceHealthStatusOptions}" th:value="${status}"
                                th:text="${status}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Lifecycle &amp; Administrative
                            Status</label>
                        <select id="editLifecycleStatus" name="lifecycleStatus" class="form-select it-field bg-white"
                            disabled>
                            <option th:each="status : ${assetLifecycleStatusOptions}" th:value="${status}"
                                th:text="${status}"></option>
                        </select>
                    </div>
                    <input type="hidden" id="editCurrentOwnerID" name="currentOwnerID">
                    <div class="col-12">
                        <label class="form-label fw-bold text-muted small text-uppercase">Remarks</label>
                        <textarea id="editRemarks" name="remarks" class="form-control it-field bg-white" rows="3"
                            disabled></textarea>
                    </div>
                </div>

                <hr class="my-4">

                <div>
                    <h6 class="fw-bold mb-3">Attached Documents</h6>
                    <div id="assetDocumentsEmpty" class="text-muted small">No documents attached yet.</div>
                    <table id="assetDocumentsTable"
                        class="table table-sm table-bordered align-middle mb-0 documents-grid-table d-none">
                        <thead class="table-light">
                            <tr>
                                <th>Category</th>
                                <th>File</th>
                                <th>Uploaded</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="assetDocumentsTableBody"></tbody>
                    </table>

                    <div class="mt-3 asset-detail-edit-only">
                        <label class="form-label fw-bold text-muted small text-uppercase">Upload Additional
                            Documents</label>
                        <input type="file" id="assetDetailDocumentFiles" class="form-control js-detail-document-input"
                            multiple data-document-preview-target="assetDetailDocumentPreview"
                            data-document-category-template-target="assetDetailDocumentCategoryTemplate"
                            th:attr="data-document-allowed-extensions=${documentUploadAllowedExtensions},data-document-max-size-mb=${documentUploadMaxSizeMb}"
                            accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx">
                        <select id="assetDetailDocumentCategoryTemplate" class="d-none">
                            <option value="" selected disabled>Select a document category</option>
                            <option th:each="documentCategory : ${itDocumentUploadCategories}"
                                th:value="${documentCategory}" th:text="${documentCategory}"></option>
                        </select>
                        <ul id="assetDetailDocumentPreview"
                            class="list-group list-group-flush border rounded mt-2 small"></ul>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="button" class="btn btn-secondary w-100" data-bs-dismiss="offcanvas">Close</button>
                    <button type="button" class="btn btn-outline-secondary w-100" id="enableEditBtn">Enable Edit
                        Mode</button>
                    <button type="button" class="btn btn-outline-danger w-100 d-none" id="cancelEditBtn">Cancel
                        Edit</button>
                    <button type="button" class="btn btn-primary w-100 d-none" id="saveEditBtn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
