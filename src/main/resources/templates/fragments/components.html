<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- Top Navigation Bar Fragment -->
    <nav th:fragment="navbar" class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <!-- TEMPORARY branding swap: was @{/logo.png} (PHLPost). Revert both
                     header images and the two footer images together. -->
                <img th:src="@{/dar.png}" alt="DAR Logo" style="height: 40px;" class="me-2">
                <span class="navbar-brand mb-0 h1 fw-bold">Support to Parcelization of Lands for Individual
                    Titling</span>
                <span class="navbar-text text-white d-none d-md-inline ms-2 border-start ps-2">
                    Broad Unified Resource & Asset Tracker
                </span>
            </div>

            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm theme-toggle-btn fw-semibold" type="button" id="themeToggleBtn"
                    title="Switch theme" aria-label="Switch theme">☀️</button>
                <div class="dropdown">
                    <button class="btn btn-outline-light btn-sm dropdown-toggle d-flex align-items-center gap-2"
                        type="button" id="userProfileMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                        <span
                            class="rounded-circle bg-light text-dark d-inline-flex justify-content-center align-items-center"
                            style="width: 32px; height: 32px; font-size: 0.9rem; font-weight: 600;"
                            th:text="${#strings.toUpperCase(#strings.substring(userDisplayName, 0, 1))}">U</span>
                        <span class="d-none d-md-inline"
                            th:text="${userDisplayName != null ? userDisplayName : 'User'}">User</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userProfileMenuButton">
                        <li>
                            <a class="dropdown-item" href="/admin/locations">Manage PSGC Data</a>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline w-100">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="dropdown-item">Logout</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <nav th:fragment="publicHeader" class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <!-- TEMPORARY branding swap: was @{/logo.png} (PHLPost). -->
                <img th:src="@{/dar.png}" alt="DAR Logo" style="height: 40px;" class="me-2">
                <span class="navbar-brand mb-0 h1 fw-bold">Support to Parcelization of Lands for Individual
                    Titling</span>
            </div>
            <button class="btn btn-sm theme-toggle-btn fw-semibold" type="button" id="themeToggleBtn"
                title="Switch theme" aria-label="Switch theme">☀️</button>
        </div>
    </nav>

    <footer th:fragment="appFooter" class="app-footer py-3 mt-4">
        <div
            class="container-fluid px-4 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <!-- TEMPORARY branding swap: were @{/logo.png} (PHLPost) and
                     @{/bagong pilipinas.png} respectively. -->
                <img th:src="@{/dar.png}" alt="DAR Logo" class="footer-logo">
                <img th:src="@{/split.jpg}" alt="SPLIT Project Logo" class="footer-logo">
                <small>© 2026 Department of Agrarian Reform. All rights reserved.</small>
            </div>
            <!-- Restore as a link once PHLPost publishes a privacy notice URL; a
                 dead href="#" is worse than no link. -->
            <small class="footer-link-muted">Department of Agrarian Reform &middot; SPLIT IT</small>
        </div>
    </footer>

</body>

</html>
