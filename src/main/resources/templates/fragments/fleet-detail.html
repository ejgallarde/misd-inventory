<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="fleetDetailOffcanvas" class="offcanvas offcanvas-end shadow" tabindex="-1"
        id="fleetDetailOffcanvas" aria-labelledby="fleetDetailLabel" style="width: min(860px, 96vw);">
        <div class="offcanvas-header bg-dark text-white">
            <h5 class="offcanvas-title mb-0" id="fleetDetailLabel">Fleet Vehicle Details</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                aria-label="Close"></button>
        </div>
        <div class="offcanvas-body bg-light">
            <form id="fleetEditForm">
                <input type="hidden" id="editFleetVehicleID" name="vehicleID">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Plate Number</label>
                        <div id="fleetDetailPlate" class="form-control-plaintext" data-lockonce-view="plateNumber">
                        </div>
                        <input type="text" id="editFleetPlateNumber" data-lockonce-input="plateNumber"
                            class="form-control fleet-lockonce-input d-none" disabled placeholder="Enter plate number">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Vehicle Type</label>
                        <div id="fleetDetailType" class="form-control-plaintext"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Make</label>
                        <div id="fleetDetailMake" class="form-control-plaintext" data-lockonce-view="make"></div>
                        <input type="text" id="editFleetMake" data-lockonce-input="make"
                            class="form-control fleet-lockonce-input d-none" disabled placeholder="e.g. Toyota">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Model</label>
                        <div id="fleetDetailModel" class="form-control-plaintext" data-lockonce-view="model"></div>
                        <input type="text" id="editFleetModel" data-lockonce-input="model"
                            class="form-control fleet-lockonce-input d-none" disabled placeholder="e.g. Hi-Lux">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Year Model</label>
                        <div id="fleetDetailYear" class="form-control-plaintext" data-lockonce-view="manufactureYear">
                        </div>
                        <select id="editFleetManufactureYear" data-lockonce-input="manufactureYear"
                            class="form-select fleet-lockonce-input d-none" disabled>
                            <option value="" disabled selected>Select year model</option>
                            <option th:each="year : ${fleetVehicleYears}" th:value="${year}" th:text="${year}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Year of Acquisition</label>
                        <div id="fleetDetailAcquisitionYear" class="form-control-plaintext"
                            data-lockonce-view="acquisitionYear"></div>
                        <select id="editFleetAcquisitionYear" data-lockonce-input="acquisitionYear"
                            class="form-select fleet-lockonce-input d-none" disabled>
                            <option value="" disabled selected>Select acquisition year</option>
                            <option th:each="year : ${fleetVehicleYears}" th:value="${year}" th:text="${year}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Body Number</label>
                        <div id="fleetDetailBodyNumber" class="form-control-plaintext" data-lockonce-view="bodyNumber">
                        </div>
                        <input type="text" id="editFleetBodyNumber" data-lockonce-input="bodyNumber"
                            class="form-control fleet-lockonce-input d-none" disabled placeholder="Enter body number">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Fuel Type</label>
                        <div id="fleetDetailFuelType" class="form-control-plaintext" data-lockonce-view="fuelType">
                        </div>
                        <select id="editFleetFuelType" data-lockonce-input="fuelType"
                            class="form-select fleet-lockonce-input d-none" disabled>
                            <option value="" disabled selected>Select fuel type</option>
                            <option th:each="fuelType : ${fleetFuelTypes}" th:value="${fuelType}" th:text="${fuelType}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Engine Number</label>
                        <div id="fleetDetailEngineNumber" class="form-control-plaintext"
                            data-lockonce-view="engineNumber"></div>
                        <input type="text" id="editFleetEngineNumber" data-lockonce-input="engineNumber"
                            class="form-control fleet-lockonce-input d-none" disabled placeholder="Enter engine number">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Chassis Number / VIN</label>
                        <div id="fleetDetailChassisVin" class="form-control-plaintext"
                            data-lockonce-view="chassisNumberVIN"></div>
                        <input type="text" id="editFleetChassisVin" data-lockonce-input="chassisNumberVIN"
                            class="form-control fleet-lockonce-input d-none" disabled
                            placeholder="Enter chassis number / VIN">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Assigned Driver</label>
                        <div id="fleetDetailDriver" class="form-control-plaintext"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Driver's Manager</label>
                        <div id="fleetDetailDriverManager" class="form-control-plaintext"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Registration Expiry</label>
                        <div id="fleetDetailRegExpiry" class="form-control-plaintext fleet-detail-view-only"></div>
                        <input type="date" id="editFleetRegistrationExpiry"
                            class="form-control fleet-field fleet-detail-edit-only d-none" disabled>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Insurance Expiry</label>
                        <div id="fleetDetailInsuranceExpiry" class="form-control-plaintext fleet-detail-view-only">
                        </div>
                        <input type="date" id="editFleetInsuranceExpiry"
                            class="form-control fleet-field fleet-detail-edit-only d-none" disabled>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Acquisition Cost</label>
                        <div id="fleetDetailCost" class="form-control-plaintext" data-lockonce-view="cost"></div>
                        <input type="text" id="editFleetCost" data-lockonce-input="cost"
                            class="form-control fleet-lockonce-input d-none" disabled placeholder="e.g. 850000.00">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Current Valuation
                            <span class="text-muted fw-normal text-lowercase ms-1" style="font-size: 0.75em;"
                                title="Straight-line depreciation per COA Circular 2003-007 (GAM): 10-year useful life, 10% residual value, 9% annual depreciation rate."
                                data-bs-toggle="tooltip" data-bs-placement="top">(GAM, straight-line)</span>
                        </label>
                        <div id="fleetDetailCurrentValuation" class="form-control-plaintext fw-bold text-primary"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Administrative &amp; Legal
                            Status</label>
                        <div id="fleetDetailAdminLegalStatus" class="form-control-plaintext fleet-detail-view-only">
                        </div>
                        <select id="editFleetAdminLegalStatus"
                            class="form-select fleet-field fleet-detail-edit-only d-none" disabled>
                            <option value="" selected disabled>Select administrative/legal status</option>
                            <option th:each="status : ${fleetAdminLegalStatuses}" th:value="${status}"
                                th:text="${status}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Operational &amp; Dispatch
                            Status</label>
                        <div id="fleetDetailOperationalStatus" class="form-control-plaintext fleet-detail-view-only">
                        </div>
                        <select id="editFleetOperationalStatus"
                            class="form-select fleet-field fleet-detail-edit-only d-none" disabled>
                            <option value="" selected disabled>Select operational/dispatch status</option>
                            <option th:each="status : ${fleetOperationalStatuses}" th:value="${status}"
                                th:text="${status}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small text-uppercase">Maintenance &amp; Health
                            Status</label>
                        <div id="fleetDetailMaintenanceStatus" class="form-control-plaintext fleet-detail-view-only">
                        </div>
                        <select id="editFleetMaintenanceStatus"
                            class="form-select fleet-field fleet-detail-edit-only d-none" disabled>
                            <option value="" selected disabled>Select maintenance/health status</option>
                            <option th:each="status : ${fleetMaintenanceStatuses}" th:value="${status}"
                                th:text="${status}"></option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold text-muted small text-uppercase">Remarks</label>
                        <div id="fleetDetailRemarks" class="form-control-plaintext fleet-detail-view-only"></div>
                        <textarea id="editFleetRemarks" rows="2"
                            class="form-control fleet-field fleet-detail-edit-only d-none" disabled></textarea>
                    </div>
                </div>

                <hr class="my-4">

                <div>
                    <h6 class="fw-bold mb-3">Attached Documents</h6>
                    <div id="fleetDocumentsEmpty" class="text-muted small">No documents attached yet.</div>
                    <table class="table table-sm table-bordered align-middle mb-0 documents-grid-table">
                        <thead class="table-light">
                            <tr>
                                <th>Category</th>
                                <th>File</th>
                                <th>Uploaded</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="fleetDocumentsTableBody"></tbody>
                    </table>
                    <div class="mt-3 fleet-detail-edit-only d-none">
                        <label class="form-label fw-bold text-muted small text-uppercase">Upload Additional
                            Documents</label>
                        <input type="file" id="fleetDetailDocumentFiles" class="form-control js-detail-document-input"
                            multiple data-document-preview-target="fleetDetailDocumentPreview"
                            data-document-category-template-target="fleetDetailDocumentCategoryTemplate"
                            th:attr="data-document-allowed-extensions=${documentUploadAllowedExtensions},data-document-max-size-mb=${documentUploadMaxSizeMb}"
                            accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx">
                        <select id="fleetDetailDocumentCategoryTemplate" class="d-none">
                            <option value="" selected disabled>Select a document category</option>
                            <option th:each="documentCategory : ${vehicleDocumentUploadCategories}"
                                th:value="${documentCategory}" th:text="${documentCategory}"></option>
                        </select>
                        <ul id="fleetDetailDocumentPreview"
                            class="list-group list-group-flush border rounded mt-2 small"></ul>
                        <div class="d-grid d-md-flex justify-content-md-end mt-2">
                            <button type="button" id="uploadFleetDocumentsBtn" class="btn btn-sm btn-primary">Upload
                                Selected</button>
                        </div>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="button" class="btn btn-secondary w-100" data-bs-dismiss="offcanvas">Close</button>
                    <button type="button" class="btn btn-outline-secondary w-100" id="enableFleetEditBtn">Enable Edit
                        Mode</button>
                    <button type="button" class="btn btn-outline-danger w-100 d-none" id="cancelFleetEditBtn">Cancel
                        Edit</button>
                    <button type="button" class="btn btn-primary w-100 d-none" id="saveFleetEditBtn">Save
                        Changes</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
