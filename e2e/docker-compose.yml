# Disposable MySQL for the Playwright suite. Runs on port 3307 so it never
# collides with a developer's own MySQL on 3306.
#
# lower_case_table_names=1 is required: the reference dumps create lowercase
# tables, while the entities and native queries use "Assets", "FleetVehicles",
# etc. Windows MySQL folds case by default; Linux MySQL does not.
services:
  mysql-e2e:
    image: mysql:8.4
    container_name: misd-mysql-e2e
    command: ["--lower-case-table-names=1", "--sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"]
    environment:
      MYSQL_ROOT_PASSWORD: e2e-root-pw
      MYSQL_DATABASE: misd_inventory
    ports:
      - "3307:3306"
    volumes:
      - ../src/main/resources/db:/schema:ro
      - ./db:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-pe2e-root-pw", "-e", "SELECT COUNT(*) FROM misd_inventory.Personnel"]
      interval: 3s
      timeout: 5s
      retries: 40

  # Demo database with the generated sample dataset (tools/sample-data), on
  # 3308 so it never touches the test database. Start with: npm run demo:up
  # (generate the data first: cd ../tools/sample-data && npm run generate).
  mysql-demo:
    profiles: ["demo"]
    image: mysql:8.4
    container_name: misd-mysql-demo
    command: ["--lower-case-table-names=1", "--sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"]
    environment:
      MYSQL_ROOT_PASSWORD: e2e-root-pw
      MYSQL_DATABASE: misd_inventory
    ports:
      - "3308:3306"
    volumes:
      - ../src/main/resources/db:/schema:ro
      - ./db/01-schema.sh:/docker-entrypoint-initdb.d/01-schema.sh:ro
      - ./db/02-migrations.sh:/docker-entrypoint-initdb.d/02-migrations.sh:ro
      - ../tools/sample-data/out/sample-data.sql:/docker-entrypoint-initdb.d/03-sample-data.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      # Healthy only once the last table the sample data fills has rows.
      test: ["CMD-SHELL", "mysql -uroot -pe2e-root-pw -N -e 'SELECT COUNT(*) FROM misd_inventory.AssetAssignments' 2>/dev/null | grep -qv '^0$'"]
      interval: 3s
      timeout: 5s
      retries: 40
